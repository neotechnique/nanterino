# Graphe de dialogue de Nanterino (version livrée avec le code).
#
# Pour changer le comportement SANS toucher au Python : copier ce fichier en
# /opt/robot/nanterino/graph.yaml, le modifier, puis POST /api/graph/reload (robot en veille ou éteint).
# Si le fichier est invalide, l'erreur est écrite dans errors.log et le robot garde CE graphe-ci.
#
# Lecture :
#   - un état = un endroit où le robot peut se trouver ; `on_enter` = ce qu'il fait en y arrivant ;
#   - une transition se déclenche sur un événement (`on:`) ou après un délai mesuré par le
#     battement de coeur (`after:` + `since:`), si ses gardes (`when:`) passent ;
#   - ordre d'évaluation : transitions `global` d'abord, puis celles de l'état courant ; la première
#     qui s'applique gagne : `do` (avant), changement d'état `to`, puis `then` (après) ;
#   - `reason` est le motif noté dans le journal ; `$source` = origine de l'ordre de démarrage.
# Les noms d'actions, de gardes et d'événements sont un vocabulaire fermé défini dans graph.py :
# un nom inconnu est refusé au chargement.
#
# `enabled: false` sur une transition : elle reste écrite (et visible, grisée, dans l'éditeur) mais le moteur
# l'ignore. Mettre `enabled: true` (ou retirer la ligne) pour l'activer.
# Exemple livré DÉSACTIVÉ (parité avec l'ancien code) : `visage_perdu`, posté par la vision quand plus aucun
# visage n'est vu depuis `lost_face_s` (10 s), dans `ecoute` et `relance` : dire au revoir (`to: cloture`).
# Lot G1 (2026-11-02) : le robot ne reste jamais bloqué hors veille quand il est sourd (micro fermé) :
#   - en veille, un visage ne déclenche plus l'accueil automatique si le robot est sourd (note au journal) ;
#   - en relance, si le micro est fermé, la clôture arrive quand même après silence_cloture_s (depuis l'entrée
#     en relance), avec une note au journal et une notification au tableau de bord.
#   Détail et justification : tests/golden/behaviour-changes-G1.md.
# Lot G2 (2026-11-02) : comportement plus riche avec les nouveaux nœuds :
#   - salutation choisie au début de la conversation (déclencheur « Une conversation commence ») : une phrase pour un
#     groupe (2 visages ou plus), sinon la phrase d'accueil de la configuration une fois sur deux, sinon une phrase
#     variée (listes salutations / salutations_groupe, sac mélangé) ; un délai de secours fait passer en écoute ;
#   - hors des horaires d'ouverture (clé opening_hours, vide par défaut = toujours ouvert), un visage n'entraîne pas
#     d'accueil automatique (note au journal) ; Démarrer et « Nanterino » saluent toujours.
#   Détail et justification : tests/golden/behaviour-changes-G2.md.
version: 1

states:
  veille:
    description: "Le robot attend un visiteur, micro ouvert pour entendre son nom."
    on_enter: [clear_conversation, reset_repairs, mic_on]
    transitions:
      # G1: one if/else on is_deaf in the editor (Vrai = note only, Faux = greet); the pair must stay adjacent.
      - on: visage
        when: [auto_greet_on_face, is_deaf]
        do: [{log_note: {level: info, text: "Visage vu, mais robot sourd : pas d'accueil automatique."}}]
        description: "Robot sourd (G1) : il n'entendrait pas la réponse, donc pas d'accueil automatique ; seulement une note au journal."
      # G2: outside the opening hours (config `opening_hours`) a face is only noted; the hours rule nests as an if/else
      # under the Faux branch of is_deaf. Empty `opening_hours` (the default) = always open: behaviour unchanged.
      - on: visage
        when: [auto_greet_on_face, {not: is_deaf}, dans_les_horaires]
        to: accueil
        description: "Un visage apparaît devant la caméra (accueil automatique activé, robot pas sourd, dans les horaires d'ouverture) : saluer."
      - on: visage
        when: [auto_greet_on_face, {not: is_deaf}, {not: dans_les_horaires}]
        do: [{log_note: {level: info, text: "Visage vu hors des horaires d'ouverture : pas d'accueil automatique."}}]
        description: "Hors des horaires d'ouverture (G2, clé opening_hours de la configuration) : pas d'accueil automatique, seulement une note au journal. Démarrer et « Nanterino » saluent toujours."
      - on: start
        to: accueil
        reason: $source
        description: "Bouton Démarrer du tableau de bord ou appui sur le visage : saluer."
      - on: intent.appel
        to: accueil
        reason: appel
        description: "Le visiteur dit « Nanterino » : saluer."
      - on: ask
        to: ecoute
        reason: ask
        then: [as_utterance]
        description: "Question tapée sur le tableau de bord (test sans micro) : passer en écoute puis la traiter."

  accueil:
    description: "Le robot salue le visiteur ; le micro est coupé pendant qu'il parle."
    on_enter: [mic_off]
    transitions:
      # G2: the greeting is chosen on `conversation_started` (posted by the brain on every move out of veille / eteint,
      # handled right after this on_enter). Nested if/else, pure guards only: every applicable non-moving chain runs
      # (dispatch), so the three branches must exclude each other. A group gets a group phrase; otherwise
      # `choix_salutation` (drawn at the end of the previous conversation, global rule) picks the config greeting
      # (dashboard text, 1) or a varied phrase from the shuffle bag (2). A random_chance guard here would be drawn
      # once per rule and could fire two branches or none.
      - on: conversation_started
        when: {face_count_compare: {op: ">=", count: 2}}
        do: [{say_random: {list: salutations_groupe}}]
        description: "Plusieurs visiteurs devant la caméra (2 visages ou plus) : une salutation pour le groupe, tirée au hasard."
      - on: conversation_started
        when: [{not: {face_count_compare: {op: ">=", count: 2}}}, {var_compare: {name: choix_salutation, op: "=", value: 1}}]
        do: [{speak_phrase: {text: greeting, done: greeting_done}}]
        description: "Un visiteur, choix 1 (une fois sur deux, et toujours la première fois après le démarrage) : la phrase d'accueil de la configuration, modifiable au tableau de bord."
      - on: conversation_started
        when: [{not: {face_count_compare: {op: ">=", count: 2}}}, {not: {var_compare: {name: choix_salutation, op: "=", value: 1}}}]
        do: [{say_random: {list: salutations}}]
        description: "Un visiteur, choix 2 : une autre salutation, tirée au hasard sans répétition (liste salutations)."
      - on: greeting_done
        to: ecoute
        description: "Salutation terminée : écouter le visiteur."
      - on: say_done
        to: ecoute
        description: "Salutation variée terminée : écouter le visiteur."
      - after: silence_cloture_s
        since: state
        when: not_speaking
        do: [{log_note: {level: warning, text: "Accueil sans salutation terminée : passage en écoute."}}]
        to: ecoute
        reason: accueil_secours
        description: "Secours (G2) : rien n'a terminé la salutation après silence_cloture_s (15 s), écouter quand même ; le robot ne reste jamais bloqué en accueil."

  ecoute:
    description: "Le robot écoute la question du visiteur."
    on_enter: [subtitle_listening, reset_silence, mic_on]
    transitions:
      - after: silence_relance_s
        since: last_speech
        when: not_busy
        to: relance
        reason: silence
        description: "Silence prolongé (silence_relance_s, 8 s) et aucune transcription en cours : relancer."
      - on: intent.au_revoir
        to: cloture
        reason: refus
        description: "Le visiteur veut partir (non merci, stop, au revoir…) : dire au revoir."
      - on: intent.chanson
        do: [reset_repairs, {emit: {event: sing}}]
        description: "Le visiteur demande une chanson : déclencher la chanson (événement sing)."
      - on: intent.question
        when: turns_left
        do: [reset_repairs, count_turn]
        to: reponse
        reason: phrase
        then: [mic_off_no_barge_in, start_answer]
        description: "Une question : répondre (micro coupé sauf si l'interruption est activée)."
      - on: intent.question
        when: {not: turns_left}
        do: [reset_repairs, count_turn]
        to: cloture
        reason: max_turns
        then: [{log_note: {level: info, text: "Nombre maximal d'échanges atteint : clôture."}}]
        description: "Trop d'échanges dans la même conversation (garde-fou MAX_TURNS) : conclure."
      - on: not_understood
        when: [not_speaking, repairs_left]
        do: [count_repair, set_relance_text]
        to: relance
        reason: pas_compris
        description: "Bruit ou parole inexploitable : demander de répéter (2 fois au plus de suite)."
      - on: not_understood
        when: [not_speaking, {not: repairs_left}]
        do: [count_repair]
        description: "Déjà deux demandes de répétition : ne plus insister, les délais prennent le relais."
      - on: visage_perdu
        enabled: false
        to: cloture
        reason: visage_perdu
        description: "EXEMPLE DÉSACTIVÉ : le visiteur est parti (plus de visage depuis lost_face_s) : dire au revoir. Activer dans l'éditeur."

  reponse:
    description: "Le robot répond (ou chante) ; les phrases sont dites au fil de la génération."
    transitions:
      - on: answer_done
        to: ecoute
        description: "Réponse terminée : écouter la suite."
      - on: barge_in
        do: [cancel_all]
        to: ecoute
        description: "Le visiteur coupe la parole (si activé) : se taire et écouter."

  relance:
    description: "Le robot relance un visiteur silencieux (ou lui demande de répéter), puis attend encore."
    on_enter: [mic_off, speak_relance]
    transitions:
      - on: relance_done
        do: [reset_silence, mic_on]
        description: "Relance terminée : rouvrir le micro, fenêtre de réponse de silence_cloture_s."
      - after: silence_cloture_s
        since: last_speech
        when: mic_active
        to: cloture
        reason: silence
        description: "Toujours rien (silence_cloture_s, 15 s) : conclure."
      - after: silence_cloture_s
        since: state
        when: [{not: mic_active}, not_speaking]
        do: [{log_note: {level: info, text: "Relance sans micro ouvert (sourd ou micro absent) : clôture."}},
             {notify_dashboard: {text: "Micro fermé (mode sourd ?) : la conversation s'est close sans réponse.", level: warning}}]
        to: cloture
        reason: micro_ferme
        description: "Micro fermé (mode sourd, micro absent) : le délai de silence ne peut pas compter, conclure quand même après silence_cloture_s (G1, jamais bloqué en relance)."
      - on: intent.au_revoir
        to: cloture
        reason: refus
        description: "Le visiteur veut partir : dire au revoir."
      - on: intent.chanson
        do: [reset_repairs, {emit: {event: sing}}]
        description: "Le visiteur demande une chanson."
      - on: intent.question
        when: turns_left
        do: [reset_repairs, count_turn]
        to: reponse
        reason: phrase
        then: [mic_off_no_barge_in, start_answer]
        description: "Une question : répondre."
      - on: intent.question
        when: {not: turns_left}
        do: [reset_repairs, count_turn]
        to: cloture
        reason: max_turns
        then: [{log_note: {level: info, text: "Nombre maximal d'échanges atteint : clôture."}}]
        description: "Trop d'échanges : conclure."
      - on: not_understood
        when: [not_speaking, repairs_left]
        do: [count_repair, set_relance_text]
        to: relance
        reason: pas_compris
        description: "Parole inexploitable : demander de répéter (2 fois au plus de suite)."
      - on: not_understood
        when: [not_speaking, {not: repairs_left}]
        do: [count_repair]
        description: "Déjà deux demandes de répétition : ne plus insister."
      - on: visage_perdu
        enabled: false
        to: cloture
        reason: visage_perdu
        description: "EXEMPLE DÉSACTIVÉ : le visiteur est parti (plus de visage) : dire au revoir. Activer dans l'éditeur."

  cloture:
    description: "Le robot dit au revoir, oublie la conversation, puis retourne en veille."
    on_enter: [mic_off, clear_history, {speak_phrase: {text: goodbye, done: goodbye_done}}]
    transitions:
      - on: goodbye_done
        do: [{schedule: {event: cloture_done, delay: cloture_to_veille_s}}]
        description: "Au revoir terminé : courte pause (cloture_to_veille_s) vérifiée par le battement de coeur."
      - on: cloture_done
        to: veille
        description: "Pause terminée : retour en veille."

  eteint:
    description: "Robot éteint : micro coupé, il n'écoute ni ne parle jusqu'à « on » ou « start »."
    on_enter: [clear_conversation, mic_off]
    transitions:
      - on: "on"
        to: veille
        description: "Bouton Allumer : retour en veille."
      - on: start
        to: accueil
        reason: $source
        description: "Bouton Démarrer : saluer directement."

global:
  - on: stop
    do: [cancel_all]
    to: veille
    description: "Bouton Stop (tout état) : se taire immédiatement et revenir en veille."
  - on: "off"
    do: [cancel_all]
    to: eteint
    description: "Bouton Éteindre (tout état) : se taire, couper le micro, ignorer tout jusqu'à « on »."
  - on: hush
    only_in: [reponse, accueil, relance]
    do: [cancel_all]
    to: ecoute
    description: "« Tais-toi » pendant que le robot parle : se taire mais garder la conversation."
  - on: hush
    only_in: [cloture]
    do: [cancel_all]
    to: veille
    description: "« Tais-toi » pendant l'au revoir : couper court et retourner en veille."
  - on: hush
    only_in: [veille, ecoute]
    do: [cancel_all]
    description: "« Tais-toi » alors que le robot ne parle pas : rien d'autre que couper le son."
  - on: sing
    not_in: [eteint]
    do: [cancel_all, mic_off]
    to: reponse
    reason: chanson
    then: [start_sing]
    description: "La chanson de Nanterino (bouton ou demande) ; micro coupé pour ne pas s'entendre chanter."
  - on: ask
    not_in: [eteint, veille]
    do: [as_utterance]
    description: "Question tapée sur le tableau de bord : la traiter comme si elle avait été dite."
  # G2: draw the next single-visitor greeting here, not in accueil: guards are judged before any action of the same
  # event runs, so a value drawn on conversation_started could not steer that event's own branches.
  - on: conversation_ended
    do: [{random_choice: {name: choix_salutation, count: 2}}]
    description: "Fin d'une conversation : tirer au hasard la prochaine salutation (1 = phrase de la configuration, 2 = phrase variée)."

intents:
  appel:
    only_in: [veille]
    words: ["nanter"]
    description: "Le nom du robot entendu en veille (en attendant un vrai mot d'appel)."
  au_revoir:
    only_in: [ecoute, relance]
    words_from: refusal_words
    description: "Le visiteur veut partir ; les mots viennent de la clé refusal_words de config.json."
  chanson:
    only_in: [ecoute, relance]
    regex: "\\b(chante[rsz]?|chantons|chanson)\\b"
    description: "Demande de chanson, mots entiers seulement (« enchanté » ne compte pas)."
  # Aucune correspondance : événement intent.question (une vraie question à traiter).

# Variables (gestionnaire de variables de l'éditeur, façon Game Creator 2).
#   names : variables nom, typées (bool, number, string, choice, duration) ; `value` = valeur au chargement du graphe
#           (en mémoire, remise à cette valeur à chaque rechargement).
#   lists : variables liste (string, number, bool) ; `from:` = liée à une clé de config.json, `intent:` = les mots d'une
#           intention (ces deux sortes sont en lecture seule) ; `items:` = liste modifiable par les actions.
# Variables système, toujours présentes et en lecture seule : etat, tours, max_tours, reparations, max_reparations.
# Variables v2 (lot L11) :
#   types en plus : integer, percent, datetime, timer (chrono), expression, gaze, phrase, media, intent_ref, list_ref,
#           state_ref, color, vector2, vector3 ; number et integer acceptent min / max / step (valeur bornée).
#   scope : global (par défaut) ou conversation (remise à la valeur initiale à chaque « Oublier la conversation ») ;
#           persist: true (variables globales seulement) garde la valeur dans state/vars.json au redémarrage.
#   lists : kind dict = dictionnaire clé → valeur ; mode plain / shuffle (sac mélangé) / history (avec max).
#   Système en plus : heure, jour, derniere_phrase, visage_vu, volume, expression, regard, nb_visiteurs_jour.
# chrono_visite et humeur_visage sont des exemples utilisés par aucune transition ; depuis G2, salutations et
# salutations_groupe sont dites par l'état accueil.
variables:
  names:
    chrono_visite:
      type: timer
      value: null
      scope: conversation
      description: "Exemple : chrono d'une visite (action « Démarrer un chrono », déclencheur « Un chrono atteint une durée »)."
    humeur_visage:
      type: expression
      value: neutre
      description: "Exemple : une expression du visage gardée en variable."
    choix_salutation:
      type: integer
      value: 1
      min: 1
      max: 2
      description: "Prochaine salutation d'un visiteur seul (G2) : 1 = phrase d'accueil de la configuration, 2 = phrase variée. Tirée à la fin de chaque conversation ; 1 au démarrage."
  lists:
    mots_refus:
      type: string
      from: refusal_words
      description: "Mots qui font partir le visiteur (clé refusal_words de config.json, intention au_revoir)."
    mots_appel:
      type: string
      intent: appel
      description: "Mots qui réveillent le robot en veille (intention appel)."
    # G2: spoken by the accueil state (say_random). The config greeting stays the other half of the single-visitor
    # greetings; every phrase here is pre-synthesised at graph load like say_text (graph.say_texts).
    salutations:
      type: string
      items: ["Bonjour et bienvenue ! Moi, c'est Nanterino. Je peux vous guider dans Nanterre ou vous donner des idées pour la planète. Que voulez-vous savoir ?",
              "Bonjour ! Je suis Nanterino, le robot de Nanterre. Un lieu à trouver, un geste pour l'environnement ? Je vous écoute.",
              "Bonjour ! Ravi de vous voir. Posez-moi une question sur Nanterre ou sur l'écologie, je vous réponds."]
      mode: shuffle
      description: "Salutations variées pour un visiteur, dites une fois sur deux à la place de la phrase d'accueil de la configuration (sac mélangé : pas de répétition avant d'avoir tout dit)."
    salutations_groupe:
      type: string
      items: ["Bonjour à tous ! Je suis Nanterino. Je connais les lieux de Nanterre et les bons gestes pour la planète. Posez-moi vos questions, une personne à la fois.",
              "Bonjour à vous tous, bienvenue ! Moi, c'est Nanterino. Qui veut me poser la première question ?"]
      mode: shuffle
      description: "Salutations pour un groupe (2 visages ou plus au début de la conversation), sac mélangé."
